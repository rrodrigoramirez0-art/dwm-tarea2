<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bocato - Sánguches Italianos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #fcfbfa;
      color: #1a1a1a;
    }

    /* Top Bar */
    header {
      background-color: #e3d2be;
      color: #1a1a1a;
      padding: 12px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .brand-badge {
      background-color: #c82333;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 14px;
    }

    .header-controls {
      display: flex;
      gap: 10px;
    }

    .btn-toggle {
      background-color: #222;
      color: #fff;
      border: 1px solid #333;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-toggle.active {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* Subheader Search */
    .search-section {
      padding: 15px 5%;
      background-color: #ffffff;
      border-bottom: 1px solid #eee;
    }

    .search-input {
      width: 100%;
      max-width: 600px;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid #e0e0e0;
      background-color: #f5f5f5;
      font-size: 14px;
      outline: none;
    }

    /* Layout Principal */
    .container {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 40px;
      padding: 30px 5%;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Categorías Laterales */
    .sidebar {
      position: sticky;
      top: 90px;
      height: fit-content;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .category-btn {
      text-align: left;
      padding: 10px 14px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 14px;
      color: #555;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .category-btn:hover {
      background-color: #f0f0f0;
      color: #000;
    }

    .category-btn.active {
      background-color: #111111;
      color: #ffffff;
      font-weight: 700;
    }

    /* Menú y Tarjetas */
    .menu-section {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    /* Tarjeta Horizontal */
    .product-card {
      background: #ffffff;
      border: 1px solid #eaeaea;
      border-radius: 16px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 130px;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }

    .product-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-title {
      font-size: 16px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .product-price {
      font-size: 15px;
      font-weight: 800;
      color: #2b7a2b;
      margin-bottom: 8px;
    }

    .product-desc {
      font-size: 12px;
      color: #777;
      line-height: 1.4;
    }

    .product-img-wrapper {
      position: relative;
      width: 130px;
      height: 110px;
      border-radius: 12px;
      overflow: hidden;
      background-color: #f8f8f8;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-add {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #ffffff;
      border: 1px solid #ddd;
      font-size: 18px;
      font-weight: bold;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .btn-add:hover {
      background-color: #111;
      color: #fff;
    }

    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .sidebar {
        position: static;
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 10px;
      }

      .category-btn {
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header>
    <div class="brand">
      <span class="brand-badge">B</span>
      <span>BOCATO</span>
    </div>
    <div class="header-controls">
      <button class="btn-toggle active">Retiro en local</button>
      <button class="btn-toggle">Delivery</button>
    </div>
  </header>

  <!-- Buscador -->
  <div class="search-section">
    <input type="text" class="search-input" id="search-input" placeholder="Buscar en Bocato (Ej. Italiano, Luco, Coca-Cola)...">
  </div>

  <!-- Layout Principal -->
  <div class="container">
    <!-- Categorías Laterales -->
    <aside class="sidebar">
      <button class="category-btn active" data-cat="ofertas">⚡ Ofertas de hoy</button>
      <button class="category-btn" data-cat="tradicionales">Sánguches Tradicionales</button>
      <button class="category-btn" data-cat="italianos">Especiales Italianos</button>
      <button class="category-btn" data-cat="luco">Barros Luco</button>
      <button class="category-btn" data-cat="bebestibles">Bebestibles</button>
    </aside>

    <!-- Menú Principal -->
    <main class="menu-section">
      <div class="section-title" id="menu-title">⚡ Ofertas de hoy</div>
      <div id="products-container" class="products-grid">
        <p style="color: #888; font-size: 14px;">Cargando menú...</p>
      </div>
    </main>
  </div>

  <script>
    // Catálogo completo con variedad
    const localCatalog = [
      {
        nombre: "Barros Luco Tradicional",
        precio: 5200,
        descripcion: "Abundante churrasco con queso mantecoso derretido.",
        cat: "luco",
        oferta: true,
        imagen: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTy3wg5Ol0LnHu_tHvWf9QtH0-pLpHdeRnealN7S3cMt1Slsk8ocVbZMUI&s=10"
      },
      {
        nombre: "Italiano Tradicional",
        precio: 5500,
        descripcion: "Churrasco, tomate, palta y mayonesa casera.",
        cat: "italianos",
        oferta: true,
        imagen: "https://media.istockphoto.com/id/1336324521/es/foto/corte-en-fr%C3%ADo-casero-italiano-sub-sandwich.jpg?s=612x612&w=0&k=20&c=5XEM00MSO8c_eW3oNTrBBQBjIwi3QU3F9wUxe2J6Y64="
      },
      {
        nombre: "Chacarero Bocato",
        precio: 5800,
        descripcion: "Churrasco, porotos verdes frescos, tomate y ají verde.",
        cat: "tradicionales",
        oferta: false,
        imagen: "https://tofuu.getjusto.com/orioneat-local/resized2/k49HxECyMRhoTGMgz-2400-x.webp"
      },
      {
        nombre: "Churrasco Ave Mayo",
        precio: 4800,
        descripcion: "Pechuga desmenuzada con mayonesa artesanal.",
        cat: "tradicionales",
        oferta: true,
        imagen: "https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=300&q=80"
      },
      {
        nombre: "Barros Luco Doble Queso",
        precio: 5900,
        descripcion: "Churrasco con doble capa de queso gouda y mantecoso.",
        cat: "luco",
        oferta: false,
        imagen: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=300&q=80"
      },
      {
        nombre: "Lomito Italiano",
        precio: 5600,
        descripcion: "Lomito de cerdo, palta fresca, tomate y mayonesa.",
        cat: "italianos",
        oferta: false,
        imagen: "https://images.unsplash.com/photo-1509722747041-616f39b57569?auto=format&fit=crop&w=300&q=80"
      },
      {
        nombre: "Coca-Cola Original 350ml",
        precio: 1500,
        descripcion: "Bebida helada en lata.",
        cat: "bebestibles",
        oferta: false,
        imagen: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=300&q=80"
      },
      {
        nombre: "Sprite 350ml",
        precio: 1500,
        descripcion: "Limonada gaseosa refrescante.",
        cat: "bebestibles",
        oferta: false,
        imagen: "https://images.unsplash.com/photo-1625772299848-391b6a87d7b3?auto=format&fit=crop&w=300&q=80"
      },
      {
        nombre: "Jugo Natural de Naranja",
        precio: 2200,
        descripcion: "Exprimidor al instante 500ml.",
        cat: "bebestibles",
        oferta: true,
        imagen: "https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=300&q=80"
      }
    ];

    let activeFilter = 'ofertas';

    async function loadProducts() {
      const container = document.getElementById('products-container');
      let products = [];

      try {
        const response = await fetch('http://127.0.0.1:8000/sandwiches');
        if (!response.ok) throw new Error('API no disponible');
        const apiData = await response.json();
        
        // Asignar categoría dinámica según el nombre si la API no la trae
        products = apiData.map(item => {
          const name = item.nombre.toLowerCase();
          let category = 'tradicionales';
          if (name.includes('luco')) category = 'luco';
          else if (name.includes('italiano')) category = 'italianos';
          else if (name.includes('coca') || name.includes('jugo') || name.includes('bebida') || name.includes('sprite')) category = 'bebestibles';
          
          return {
            ...item,
            cat: item.categoria || category,
            oferta: item.precio <= 5200
          };
        });
      } catch (e) {
        products = localCatalog;
      }

      // Filtrar según la categoría seleccionada
      let filtered = [];
      if (activeFilter === 'ofertas') {
        filtered = products.filter(p => p.oferta);
      } else {
        filtered = products.filter(p => p.cat === activeFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: #777; grid-column: 1/-1;">No hay productos disponibles en esta categoría.</p>';
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div class="product-card">
          <div class="product-info">
            <div>
              <div class="product-title">${p.nombre}</div>
              <div class="product-price">$${p.precio.toLocaleString('es-CL')}</div>
              <div class="product-desc">${p.descripcion || 'Preparado con ingredientes de la casa.'}</div>
            </div>
          </div>
          <div class="product-img-wrapper">
            <img src="${p.imagen || 'https://images.unsplash.com/photo-1509722747041-616f39b57569?auto=format&fit=crop&w=300&q=80'}" class="product-img" alt="${p.nombre}">
            <button class="btn-add">+</button>
          </div>
        </div>
      `).join('');
    }

    // Cambiar estado entre Retiro y Delivery
    document.querySelectorAll('.btn-toggle').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
      });
    });

    // Cambiar categoría activa
    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');

        activeFilter = e.target.getAttribute('data-cat');
        document.getElementById('menu-title').textContent = e.target.textContent;
        loadProducts();
      });
    });

    // Buscador en tiempo real
    document.getElementById('search-input').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const cards = document.querySelectorAll('.product-card');
      cards.forEach(card => {
        const title = card.querySelector('.product-title').textContent.toLowerCase();
        card.style.display = title.includes(term) ? 'grid' : 'none';
      });
    });

    loadProducts();
  </script>
</body>
</html>
